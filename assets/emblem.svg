<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Habemus Deploy emblem: a gold dove ascending with an olive branch over a rising deploy chevron">
  <title>Habemus Deploy</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#2a2f5c"/>
      <stop offset="100%" stop-color="#12132a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#ffe6a6" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffe6a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9ad"/>
      <stop offset="55%" stop-color="#f3c462"/>
      <stop offset="100%" stop-color="#d99428"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <circle cx="256" cy="238" r="150" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="212" fill="none" stroke="#f3c462" stroke-width="4" opacity="0.8"/>

  <!-- rising deploy chevron (the "deployment ascending" base), behind the dove -->
  <g fill="none" stroke="#f3c462" stroke-linecap="round" stroke-linejoin="round" opacity="0.42">
    <polyline points="196,360 256,318 316,360" stroke-width="13"/>
    <polyline points="210,398 256,366 302,398" stroke-width="9"/>
  </g>

  <!-- DOVE ascending, wings spread upward -->
  <g fill="url(#gold)">
    <!-- left wing -->
    <path d="M256 250
             C 224 250 206 232 182 210
             C 150 180 120 150 96 132
             C 138 140 176 154 210 178
             C 200 156 196 132 198 108
             C 214 140 236 170 256 196 Z"/>
    <!-- right wing (mirror of left about x=256) -->
    <path d="M256 250
             C 288 250 306 232 330 210
             C 362 180 392 150 416 132
             C 374 140 336 154 302 178
             C 312 156 316 132 314 108
             C 298 140 276 170 256 196 Z"/>
    <!-- body: rounded breast tapering to the tail -->
    <path d="M256 198
             C 238 206 230 224 230 248
             C 230 272 240 292 256 306
             C 272 292 282 272 282 248
             C 282 224 274 206 256 198 Z"/>
    <!-- tail feathers (short fan) -->
    <path d="M256 298 L238 330 L256 318 L274 330 Z"/>
    <!-- head -->
    <circle cx="256" cy="180" r="20"/>
  </g>
  <!-- beak -->
  <path d="M256 162 L249 150 L263 150 Z" fill="#d99428"/>
  <!-- eye -->
  <circle cx="256" cy="178" r="3.2" fill="#12132a"/>

  <!-- olive sprig held above the beak -->
  <g stroke="#bfe3a0" stroke-width="3" fill="#bfe3a0" stroke-linecap="round">
    <line x1="256" y1="150" x2="256" y2="120"/>
    <ellipse cx="248" cy="132" rx="6" ry="3" transform="rotate(50 248 132)"/>
    <ellipse cx="264" cy="128" rx="6" ry="3" transform="rotate(-50 264 128)"/>
    <ellipse cx="256" cy="118" rx="6" ry="3"/>
  </g>

  <!-- monospace command caret ">_" as the deploy signature -->
  <g fill="none" stroke="#f3c462" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <polyline points="232,446 246,436 232,426"/>
    <line x1="256" y1="446" x2="280" y2="446"/>
  </g>
</svg>
